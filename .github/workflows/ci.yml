name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays: the thorough property-based run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"]  # the version the pinned dependencies were tested with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with every optional dependency (pinned)
        run: python -m pip install -e ".[all]"
      - name: Run the test suite
        run: python -m unittest discover

  minimal:
    name: Minimal install (NumPy only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package alone
        run: python -m pip install -e .
      # Tests that need JAX, Qiskit or Hypothesis must skip, not fail.
      - name: Run the test suite
        run: python -m unittest discover

  experiments:
    name: Experiment smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with plotting
        run: python -m pip install -e ".[plots]"
      # The two quickest experiments, to catch scripts that no longer run.
      # Results are not compared byte for byte: floating-point output can
      # differ in the last digits across platforms.
      - name: Grover success curve
        run: python -m experiments.grover
      - name: MPS truncation study
        run: python -m experiments.mps_truncation

  thorough-properties:
    name: Thorough property-based tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with test dependencies
        run: python -m pip install -e ".[test]"
      - name: 2000 random circuits per property
        env:
          HYPOTHESIS_PROFILE: thorough
        run: python -m unittest tests.test_properties
